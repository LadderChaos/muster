<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Muster">
<title>Muster</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-256.png">
<link rel="apple-touch-icon" href="/icon-256.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="top">
  <div class="bar">
    <span class="brand">MUSTER</span>
    <button id="backend" class="chip" type="button"></button>
    <span id="conn" class="conn" title="Connection"></span>
  </div>
  <div id="summary" class="summary"></div>
  <nav id="tabs">
    <a href="#/chats" data-tab="chats">Chats</a>
    <a href="#/agents" data-tab="agents">Agents</a>
  </nav>
</header>
<div id="banner" class="banner" hidden></div>
<main id="main"></main>
<form id="composer" hidden>
  <textarea id="text" rows="1" placeholder="Message" autocomplete="off"></textarea>
  <button id="send" type="submit">Send</button>
  <div id="sendStatus" class="sendStatus"></div>
</form>
<script src="/app.js"></script>
</body>
</html>
